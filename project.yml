name: OpenCardboard
options:
  bundleIdPrefix: com.example
targets:
  OpenCardboard:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: OpenCardboard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        NSMotionUsageDescription: Used for head tracking.
        NSCameraUsageDescription: Used for optional camera-based head position tracking.
        NSLocalNetworkUsageDescription: Used to connect to your PC for VR streaming.
        NSBonjourServices: [_opencardboard._tcp]
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.opencardboard
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
